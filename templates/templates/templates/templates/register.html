
{% extends "base.html" %}
{% block title %}Créer un compte · NDIAYE DIGITAL PRO{% endblock %}
{% block content %}
<section class="form-card">
  <div class="eyebrow">COMMENCER</div>
  <h1>Créer votre espace</h1>
  <form method="post">
    <label>Nom de la boutique</label>
    <input name="shop_name" required placeholder="Ex. Boutique Ameth">
    <label>Votre nom</label>
    <input name="owner_name" required placeholder="Nom du responsable">
    <label>E-mail</label>
    <input type="email" name="email" required placeholder="vous@exemple.com">
    <label>Mot de passe</label>
    <input type="password" name="password" minlength="8" required placeholder="8 caractères minimum">
    <button class="btn gold full">Créer mon compte</button>
  </form>
  <p class="muted">Déjà inscrit ? <a href="/login">Se connecter</a></p>
</section>
{% endblock %}
